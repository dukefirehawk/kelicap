version: 0.1.0

environment:
  sdk: ">=3.13.0 <4.0.0"

publish_to: none

dependencies:
  kelicap: ^2.0.0
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.4.0
  build_web_compilers: ^4.8.0
  lints: ^6.1.0
