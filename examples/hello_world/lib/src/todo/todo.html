<div class="todo-container">
  <h2>My Tasks ({{ remaining() }})</h2>

  <!-- The input is passed to addTodo, which reads its typed value -->
  <input #newTodo placeholder="New task" (keyup.enter)="addTodo(newTodo)">
  <button id="add-todo" (click)="addTodo(newTodo)">Add</button>

  <!-- Basic *ngFor loop with index tracking -->
  <ul>
    <li *ngFor="let todo of todos(); let i = index">
      <span>{{ i + 1 }}. {{ todo }}</span>
      <button (click)="removeTodo(i)">Delete</button>
    </li>
  </ul>

  <!-- Fallback if list is empty using *ngIf -->
  <p *ngIf="todos().isEmpty">No tasks remaining! Great job.</p>
</div>
