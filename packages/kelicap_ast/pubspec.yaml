name: kelicap_ast
description: >
  Kelicap AST parser and utilities.
  It parses Kelicap component templates and expressions into a structured tree representation (Abstract Syntax Tree) 
  of JavaScript objects (nodes).
version: 1.1.0
repository: https://github.com/dukefirehawk/kelicap

environment:
  sdk: ">=3.13.0 <4.0.0"

resolution: workspace

dependencies:
  charcode: ^1.3.1
  collection: ^1.17.0
  meta: ^1.8.0
  source_span: ^1.9.1
  string_scanner: ^1.2.0

dev_dependencies:
  lints: ^6.0.0
  path: ^1.8.3
  test: ^1.31.0
