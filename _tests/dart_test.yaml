# Include common configuration.
include: ../tool/dart_test_repo.yaml

presets:
  browser:
    platforms:
      - chrome
    paths:
      - test/bootstrap
      - test/common
      - test/core
      - test/di
      - test/integration
      - test/platform
      # re-integrate from 'tests'
      - test/devtools
      - test/directives
      - test/lifecycle_hooks
      - test/templates
      - test/security
      - test/signals
    add_presets: [ci]

  vm:
    platforms:
      - vm
    paths:
      - test/compiler
      - test/compiler_integration
      # Tests of kelicap_compiler that resolve code importing package:kelicap,
      # kept here so that kelicap_compiler does not depend on kelicap.
      - test/compiler_resolved
    add_presets: [ci]
