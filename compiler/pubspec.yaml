name: kelicap_compiler
description: >
  The Kelicap compiler.
  Transforms Kelicap template in HTML, CSS and Dart code into highly optimized instructions that the browser 
  can directly execute.
version: 1.0.0
repository: https://github.com/dukefirehawk/kelicap

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  analyzer: ^13.0.0
  args: ^2.3.2
  build: ^4.0.0
  build_test: ^3.0.0
  code_builder: ^4.4.0
  collection: ^1.17.0
  csslib: ^1.0.0
  dart_style: ^3.0.1
  logging: ^1.1.0
  meta: ^1.8.0
  kelicap_ast: ^1.0.0
  package_config: ^2.1.0
  path: ^1.8.3
  source_gen: ^4.0.0
  source_span: ^1.9.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.22.2
